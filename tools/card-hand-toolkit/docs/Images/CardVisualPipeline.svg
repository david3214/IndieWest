<svg xmlns="http://www.w3.org/2000/svg" width="900" height="476" viewBox="0 0 900 476" role="img" aria-labelledby="title desc">
  <title id="title">Building the card visuals</title>
  <desc id="desc">The Visual Factory looks up a slug, instantiates the card, initializes CardBehaviour and creates the ViewModel. CardBehaviour sends frame, art and back to Card3DView. CardPresenter builds the World View from the Card Skin; the binder writes data and field toggles set visibility.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="476" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="24" y="36" font-size="25" fill="#172b45" font-weight="700" text-anchor="start">Building the card visuals</text>
    <text x="24" y="63" font-size="16" fill="#52647a" font-weight="400" text-anchor="start">The mesh and the World View receive their content through different paths.</text>
    <path d="M 450 176 V 218 H 228 V 260" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 450 218 H 672 V 260" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="24" y="100" width="852" height="76" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="42" y="129" font-size="20" fill="#12634f" font-weight="700" text-anchor="start">CardVisualFactorySO.Build(cardRef)</text><text x="42" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Look up slug, instantiate card, initialize CardBehaviour and create the ViewModel.</text>
    <rect x="24" y="260" width="408" height="154" rx="12" fill="#eaf1ff" stroke="#a2bdec"/><text x="42" y="289" font-size="20" fill="#28559b" font-weight="700" text-anchor="start">Card mesh</text><text x="42" y="316" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">CardBehaviour sends sprites to Card3DView.</text><text x="42" y="339" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Frame + back: CardFrameLibrary.</text><text x="42" y="362" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Art: the ScriptableCard.</text>
    <rect x="468" y="260" width="408" height="154" rx="12" fill="#f0ebfc" stroke="#baa9e2"/><text x="486" y="289" font-size="20" fill="#63439b" font-weight="700" text-anchor="start">World View</text><text x="486" y="316" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">CardPresenter builds it from the Card Skin.</text><text x="486" y="339" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Binder writes the ViewModel data.</text><text x="486" y="362" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">FieldToggles decide which elements show.</text>
    <text x="24" y="450" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">SingleSprite skips the World View; opaque card art supplies the finished face.</text>
  </g>
</svg>
