<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">Card lifecycle</title>
  <desc id="desc">Draw a CardRef, add it to hand state, and look for its visual. Reuse an existing visual or build and bind one. The hand lays it out. A play resolver accepts a released card into a zone, or the card stays in hand.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="680" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="24" y="36" font-size="25" font-weight="700" fill="#172b45">Card lifecycle</text>
    <text x="24" y="63" font-size="16" fill="#52647a">Draw a copy, show it in the hand, then resolve a play.</text>

    <g fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M 276 140 H 324"/>
      <path d="M 576 140 H 624"/>
      <path d="M 750 184 V 212 H 150 V 244"/>
      <path d="M 750 184 V 244"/>
      <path d="M 150 368 V 394 H 450 V 420"/>
      <path d="M 600 368 V 394 H 450 V 420"/>
      <path d="M 450 500 V 552"/>
      <path d="M 270 594 H 234"/>
      <path d="M 630 594 H 666"/>
    </g>

    <rect x="24" y="96" width="252" height="88" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/>
    <text x="42" y="124" font-size="18" font-weight="700" fill="#12634f">Draw a card</text>
    <text x="42" y="150" font-size="16" fill="#263e50">Deck.Draw() returns a CardRef</text>
    <text x="42" y="172" font-size="14" fill="#52647a">Slug + unique instance id</text>

    <rect x="324" y="96" width="252" height="88" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/>
    <text x="342" y="124" font-size="18" font-weight="700" fill="#12634f">Update hand state</text>
    <text x="342" y="150" font-size="16" fill="#263e50">HandStateService.AddCard()</text>
    <text x="342" y="172" font-size="14" fill="#52647a">Notifies the hand for that seat</text>

    <rect x="624" y="96" width="252" height="88" rx="12" fill="#eaf1ff" stroke="#a2bdec"/>
    <text x="642" y="124" font-size="18" font-weight="700" fill="#28559b">Find the visual</text>
    <text x="642" y="150" font-size="16" fill="#263e50">Hand checks SceneCardLookup</text>
    <text x="642" y="172" font-size="14" fill="#52647a">Lookup by instance id</text>

    <text x="168" y="235" font-size="14" font-weight="700" fill="#28559b">FOUND</text>
    <text x="766" y="235" font-size="14" font-weight="700" fill="#28559b">MISSING</text>
    <rect x="24" y="244" width="252" height="124" rx="12" fill="#eaf1ff" stroke="#a2bdec"/>
    <text x="42" y="274" font-size="18" font-weight="700" fill="#28559b">Reuse the visual</text>
    <text x="42" y="302" font-size="16" fill="#263e50">Keep the existing GameObject</text>
    <text x="42" y="326" font-size="16" fill="#263e50">and its ViewModel.</text>
    <text x="42" y="352" font-size="14" fill="#52647a">For example, returning from a zone</text>

    <rect x="324" y="244" width="552" height="124" rx="12" fill="#eaf1ff" stroke="#a2bdec"/>
    <text x="342" y="274" font-size="18" font-weight="700" fill="#28559b">Build and bind the visual</text>
    <text x="342" y="302" font-size="16" fill="#263e50">CardVisualFactorySO: look up slug, instantiate the card,</text>
    <text x="342" y="326" font-size="16" fill="#263e50">initialize CardBehaviour and create its ViewModel.</text>
    <text x="342" y="352" font-size="16" fill="#263e50">CardPresenter: bind the World View and apply field visibility.</text>

    <rect x="270" y="420" width="360" height="80" rx="12" fill="#eaf1ff" stroke="#a2bdec"/>
    <text x="450" y="450" text-anchor="middle" font-size="18" font-weight="700" fill="#28559b">Hand lays out the card</text>
    <text x="450" y="478" text-anchor="middle" font-size="16" fill="#263e50">Parent, position and animate the visual</text>
    <text x="466" y="530" font-size="14" fill="#52647a">Release above Play Height, outside reorder band</text>

    <rect x="270" y="552" width="360" height="84" rx="12" fill="#f0ebfc" stroke="#baa9e2"/>
    <text x="450" y="582" text-anchor="middle" font-size="18" font-weight="700" fill="#63439b">Does a play resolver accept?</text>
    <text x="450" y="610" text-anchor="middle" font-size="16" fill="#263e50">Try lowest Priority first; stop on acceptance</text>
    <text x="252" y="583" text-anchor="middle" font-size="13" font-weight="700" fill="#63439b">NO</text>
    <text x="648" y="583" text-anchor="middle" font-size="13" font-weight="700" fill="#63439b">YES</text>

    <rect x="24" y="552" width="210" height="84" rx="12" fill="#fff4df" stroke="#e3c78d"/>
    <text x="129" y="582" text-anchor="middle" font-size="18" font-weight="700" fill="#825c17">Return to hand</text>
    <text x="129" y="610" text-anchor="middle" font-size="15" fill="#263e50">Hand membership stays</text>
    <rect x="666" y="552" width="210" height="84" rx="12" fill="#f0ebfc" stroke="#baa9e2"/>
    <text x="771" y="582" text-anchor="middle" font-size="18" font-weight="700" fill="#63439b">Move into a zone</text>
    <text x="771" y="610" text-anchor="middle" font-size="15" fill="#263e50">Resolver removes + adds</text>
    <text x="24" y="662" font-size="14" fill="#52647a">Your game owns rules and turns. The toolkit owns the hand, presentation and interaction flow.</text>
  </g>
</svg>
