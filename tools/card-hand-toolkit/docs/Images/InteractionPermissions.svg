<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" role="img" aria-labelledby="title desc">
  <title id="title">Interaction permissions</title>
  <desc id="desc">InteractionController refreshes on zone changes or explicit calls. It chooses a zone or global policy, applies card overrides with Deny winning, and enables hover, drag and tap. Target permissions are read by game code.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="456" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="24" y="36" font-size="25" fill="#172b45" font-weight="700" text-anchor="start">Interaction permissions</text>
    <text x="24" y="63" font-size="16" fill="#52647a" font-weight="400" text-anchor="start">Choose a policy, apply overrides, then enable the permitted input components.</text>
    <path d="M 276 150 H 324" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 576 150 H 624" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 750 200 V 260 H 121 V 310" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 750 260 H 340 V 310" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 750 260 H 559 V 310" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 750 260 H 778 V 310" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="24" y="100" width="252" height="100" rx="12" fill="#eaf1ff" stroke="#a2bdec"/><text x="42" y="129" font-size="18" fill="#28559b" font-weight="700" text-anchor="start">InteractionController</text><text x="42" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Zone change, Refresh()</text><text x="42" y="179" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">or RefreshAll().</text>
    <rect x="324" y="100" width="252" height="100" rx="12" fill="#f0ebfc" stroke="#baa9e2"/><text x="342" y="129" font-size="18" fill="#63439b" font-weight="700" text-anchor="start">Choose the policy</text><text x="342" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Zone policy if supplied;</text><text x="342" y="179" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">otherwise the global policy.</text>
    <rect x="624" y="100" width="252" height="100" rx="12" fill="#f0ebfc" stroke="#baa9e2"/><text x="642" y="129" font-size="18" fill="#63439b" font-weight="700" text-anchor="start">Apply card overrides</text><text x="642" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Allow adds permissions.</text><text x="642" y="179" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Deny removes them last.</text>
    <text x="24" y="238" font-size="14" fill="#28559b" font-weight="400" text-anchor="start">EFFECTIVE PERMISSIONS</text>
    <rect x="24" y="310" width="195" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="42" y="339" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">Hover</text><text x="42" y="366" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">CardHoverable</text><text x="42" y="389" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Enable when allowed.</text>
    <rect x="243" y="310" width="195" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="261" y="339" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">Drag</text><text x="261" y="366" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">DragCard</text><text x="261" y="389" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Enable when allowed.</text>
    <rect x="462" y="310" width="195" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="480" y="339" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">Select</text><text x="480" y="366" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">CardTap</text><text x="480" y="389" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Enable when allowed.</text>
    <rect x="681" y="310" width="195" height="100" rx="12" fill="#fff4df" stroke="#e3c78d"/><text x="699" y="339" font-size="18" fill="#825c17" font-weight="700" text-anchor="start">Target</text><text x="699" y="366" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Your targeting code</text><text x="699" y="389" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Reads Permissions.</text>
    <text x="24" y="438" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">Call Refresh() or RefreshAll() when game state used by your policy changes.</text>
  </g>
</svg>
