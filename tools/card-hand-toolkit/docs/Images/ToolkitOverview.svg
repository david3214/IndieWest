<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" role="img" aria-labelledby="title desc">
  <title id="title">Toolkit at a glance</title>
  <desc id="desc">CardToolkitRuntime supplies shared assets and policy. Your game draws cards and updates HandStateService, and matching hand views show those cards.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="352" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="24" y="36" font-size="25" fill="#172b45" font-weight="700" text-anchor="start">Toolkit at a glance</text>
    <text x="24" y="63" font-size="16" fill="#52647a" font-weight="400" text-anchor="start">Every scene with cards has a loader; the first one loaded persists.</text>
    <path d="M 450 170 V 194 H 750 V 228" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 276 278 H 324" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 576 278 H 624" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="24" y="96" width="852" height="74" rx="12" fill="#f0ebfc" stroke="#baa9e2"/><text x="42" y="125" font-size="18" fill="#63439b" font-weight="700" text-anchor="start">CardToolkitRuntime on CHT_CardToolkitLoader</text><text x="42" y="152" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Database, Frame Library, Hover Profile, Visual Factory and Interaction Policy</text>
    <text x="486" y="214" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">Shared assets and policy</text>
    <rect x="24" y="228" width="252" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="42" y="257" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">Your game</text><text x="42" y="284" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Draw a CardRef from a Deck.</text><text x="42" y="307" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Choose the destination seat.</text>
    <rect x="324" y="228" width="252" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="342" y="257" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">HandStateService</text><text x="342" y="284" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Hand membership by seat.</text><text x="342" y="307" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Raises add / remove events.</text>
    <rect x="624" y="228" width="252" height="100" rx="12" fill="#eaf1ff" stroke="#a2bdec"/><text x="642" y="257" font-size="18" fill="#28559b" font-weight="700" text-anchor="start">Hand views</text><text x="642" y="284" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">PlayerHand / OpponentHand</text><text x="642" y="307" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Reuse or build card visuals.</text>
  </g>
</svg>
