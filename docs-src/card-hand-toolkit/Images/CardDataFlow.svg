<svg xmlns="http://www.w3.org/2000/svg" width="900" height="512" viewBox="0 0 900 512" role="img" aria-labelledby="title desc">
  <title id="title">Card data and drawing</title>
  <desc id="desc">ScriptableCard designs are indexed by slug in the Card Database. DeckList creates a runtime Deck of unique CardRefs. Drawing and adding a CardRef to HandStateService causes the matching hand to reuse or build its visual.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="512" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="24" y="36" font-size="25" fill="#172b45" font-weight="700" text-anchor="start">Card data and drawing</text>
    <text x="24" y="63" font-size="16" fill="#52647a" font-weight="400" text-anchor="start">A design is shared; every physical copy gets its own CardRef.</text>
    <path d="M 276 141 H 324" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 276 296 H 324" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 576 296 H 624" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 750 340 V 400" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="24" y="100" width="252" height="82" rx="12" fill="#eaf1ff" stroke="#a2bdec"/><text x="42" y="129" font-size="18" fill="#28559b" font-weight="700" text-anchor="start">ScriptableCard</text><text x="42" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">One design + its addon data.</text>
    <rect x="324" y="100" width="252" height="82" rx="12" fill="#eaf1ff" stroke="#a2bdec"/><text x="342" y="129" font-size="18" fill="#28559b" font-weight="700" text-anchor="start">Card Database</text><text x="342" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Indexes designs by slug.</text>
    <rect x="624" y="100" width="252" height="82" rx="12" fill="#f0ebfc" stroke="#baa9e2"/><text x="642" y="129" font-size="18" fill="#63439b" font-weight="700" text-anchor="start">CardRef</text><text x="642" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Slug + unique instance id.</text>
    <text x="24" y="228" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">ToSlugDeck() makes a fresh copy id for every DeckList entry.</text>
    <rect x="24" y="252" width="252" height="88" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="42" y="281" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">DeckList</text><text x="42" y="308" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Author the starting cards.</text>
    <rect x="324" y="252" width="252" height="88" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="342" y="281" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">Deck&lt;CardRef&gt;</text><text x="342" y="308" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Runtime draw + discard piles.</text>
    <rect x="624" y="252" width="252" height="88" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="642" y="281" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">HandStateService</text><text x="642" y="308" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">AddCard(seat, cardRef)</text>
    <text x="600" y="242" font-size="14" fill="#52647a" font-weight="400" text-anchor="middle">Draw()</text>
    <text x="766" y="378" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">OnCardAdded</text>
    <rect x="624" y="400" width="252" height="88" rx="12" fill="#eaf1ff" stroke="#a2bdec"/><text x="642" y="429" font-size="17" fill="#28559b" font-weight="700" text-anchor="start">Hand view shows the copy</text><text x="642" y="456" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Reuse, or Visual Factory.Build().</text>
    <text x="24" y="414" font-size="18" fill="#28559b" font-weight="700" text-anchor="start">Building a visual?</text>
    <text x="24" y="442" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">The Visual Factory resolves its slug through the Card Database.</text>
    <text x="24" y="466" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Existing instance ids reuse the card already in the scene.</text>
  </g>
</svg>
