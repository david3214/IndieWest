<svg xmlns="http://www.w3.org/2000/svg" width="900" height="568" viewBox="0 0 900 568" role="img" aria-labelledby="title desc">
  <title id="title">From drag to play</title>
  <desc id="desc">Release in the reorder band to reorder. Otherwise, release above Play Height to try resolvers in priority order. The first accepting resolver moves the card; if none accepts it, it returns to the hand.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="568" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="24" y="36" font-size="25" fill="#172b45" font-weight="700" text-anchor="start">From drag to play</text>
    <text x="24" y="63" font-size="16" fill="#52647a" font-weight="400" text-anchor="start">Reordering takes precedence; an accepted play is moved by its resolver.</text>
    <path d="M 276 143 H 324" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 576 143 H 624" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 450 186 V 230" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 324 273 H 276" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 450 316 V 364" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 576 414 H 624" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 450 464 V 508 H 150 V 316" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="24" y="100" width="252" height="86" rx="12" fill="#eaf1ff" stroke="#a2bdec"/><text x="42" y="129" font-size="18" fill="#28559b" font-weight="700" text-anchor="start">Release a dragged card</text><text x="42" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Use the pointer release point.</text>
    <rect x="324" y="100" width="252" height="86" rx="12" fill="#f0ebfc" stroke="#baa9e2"/><text x="342" y="129" font-size="18" fill="#63439b" font-weight="700" text-anchor="start">Inside reorder band?</text><text x="342" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Check the source hand.</text>
    <rect x="624" y="100" width="252" height="86" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="642" y="129" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">Reorder in hand</text><text x="642" y="156" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Move to the chosen index.</text>
    <text x="588" y="131" font-size="14" fill="#12634f" font-weight="400" text-anchor="start">YES</text>
    <text x="466" y="216" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">NO</text>
    <rect x="324" y="230" width="252" height="86" rx="12" fill="#f0ebfc" stroke="#baa9e2"/><text x="342" y="259" font-size="18" fill="#63439b" font-weight="700" text-anchor="start">Above Play Height?</text><text x="342" y="286" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Only try a play above the line.</text>
    <rect x="24" y="230" width="252" height="86" rx="12" fill="#fff4df" stroke="#e3c78d"/><text x="42" y="259" font-size="18" fill="#825c17" font-weight="700" text-anchor="start">Return to hand</text><text x="42" y="286" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Hand membership stays.</text>
    <text x="285" y="260" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">NO</text>
    <text x="466" y="346" font-size="14" fill="#12634f" font-weight="400" text-anchor="start">YES</text>
    <rect x="324" y="364" width="252" height="100" rx="12" fill="#f0ebfc" stroke="#baa9e2"/><text x="342" y="393" font-size="18" fill="#63439b" font-weight="700" text-anchor="start">Try play resolvers</text><text x="342" y="420" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Lowest Priority first.</text><text x="342" y="443" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Reject? Try the next resolver.</text>
    <rect x="624" y="364" width="252" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/><text x="642" y="393" font-size="18" fill="#12634f" font-weight="700" text-anchor="start">Accept and move</text><text x="642" y="420" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">Remove from hand state;</text><text x="642" y="443" font-size="16" fill="#263e50" font-weight="400" text-anchor="start">add to the destination zone.</text>
    <text x="585" y="402" font-size="14" fill="#12634f" font-weight="400" text-anchor="start">YES</text>
    <text x="180" y="496" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">None accept</text>
    <text x="24" y="546" font-size="14" fill="#52647a" font-weight="400" text-anchor="start">Resolvers are collected at drop time. Equal priorities have no fixed order.</text>
  </g>
</svg>
