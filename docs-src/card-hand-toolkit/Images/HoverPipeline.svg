<svg xmlns="http://www.w3.org/2000/svg" width="900" height="624" viewBox="0 0 900 624" role="img" aria-labelledby="title desc">
  <title id="title">Hover pipeline</title>
  <desc id="desc">PointerService feeds CardHoverable. Touch arbitration grants a card claim, and CardBehaviour updates hover flags and events. In the hand, layout and pose lift and scale the card. Outside the hand, HoverPolicyRuntime filters events and routes an allowed preview to HoverPresenter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="624" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="24" y="36" font-size="25" font-weight="700" fill="#172b45">Hover pipeline</text>
    <text x="24" y="63" font-size="16" fill="#52647a">One input path, two ways to show a hovered card.</text>

    <g fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M 219 154 H 243"/>
      <path d="M 438 154 H 462"/>
      <path d="M 657 154 H 681"/>
      <path d="M 778 204 V 228 H 219 V 272"/>
      <path d="M 778 204 V 228 H 681 V 272"/>
      <path d="M 219 372 V 416"/>
      <path d="M 681 372 V 416"/>
    </g>

    <rect x="24" y="104" width="195" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/>
    <text x="40" y="134" font-size="18" font-weight="700" fill="#12634f">PointerService</text>
    <text x="40" y="162" font-size="16" fill="#263e50">Read one pointer</text>
    <text x="40" y="186" font-size="15" fill="#52647a">Mouse or touch</text>

    <rect x="243" y="104" width="195" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/>
    <text x="259" y="134" font-size="18" font-weight="700" fill="#12634f">CardHoverable</text>
    <text x="259" y="162" font-size="16" fill="#263e50">Hit test + timing</text>
    <text x="259" y="186" font-size="15" fill="#52647a">From HoverProfile</text>

    <rect x="462" y="104" width="195" height="100" rx="12" fill="#e7f5f1" stroke="#8cc9b8"/>
    <text x="478" y="134" font-size="16" font-weight="700" fill="#12634f">HoverPointerArbiter</text>
    <text x="478" y="162" font-size="16" fill="#263e50">Claim a card for touch</text>
    <text x="478" y="186" font-size="15" fill="#52647a">Mouse skips claims</text>

    <rect x="681" y="104" width="195" height="100" rx="12" fill="#eaf1ff" stroke="#a2bdec"/>
    <text x="697" y="134" font-size="18" font-weight="700" fill="#28559b">CardBehaviour</text>
    <text x="697" y="162" font-size="16" fill="#263e50">Apply hover state</text>
    <text x="697" y="186" font-size="15" fill="#52647a">Flags + hover events</text>

    <text x="24" y="258" font-size="14" font-weight="700" fill="#28559b">IN HAND</text>
    <text x="486" y="258" font-size="14" font-weight="700" fill="#63439b">OUT OF HAND</text>
    <rect x="24" y="272" width="390" height="100" rx="12" fill="#eaf1ff" stroke="#a2bdec"/>
    <text x="44" y="302" font-size="19" font-weight="700" fill="#28559b">PlayerHand + CardPoseView</text>
    <text x="44" y="330" font-size="16" fill="#263e50">Hand layout lifts; pose scales and brings forward.</text>
    <text x="44" y="354" font-size="15" fill="#52647a">Driven by hover flags; no overlay is needed.</text>

    <rect x="486" y="272" width="390" height="100" rx="12" fill="#f0ebfc" stroke="#baa9e2"/>
    <text x="506" y="302" font-size="19" font-weight="700" fill="#63439b">HoverPolicyRuntime</text>
    <text x="506" y="330" font-size="16" fill="#263e50">Subscribes directly to static hover events.</text>
    <text x="506" y="354" font-size="15" fill="#52647a">Checks UI, face-down rules and exclusivity.</text>

    <text x="697" y="400" font-size="14" fill="#63439b">Preview allowed</text>
    <rect x="24" y="416" width="390" height="88" rx="12" fill="#eaf1ff" stroke="#a2bdec"/>
    <text x="44" y="446" font-size="19" font-weight="700" fill="#28559b">Hover the card itself</text>
    <text x="44" y="474" font-size="16" fill="#263e50">Mouse: anchor line. Touch: Touch Hover Height.</text>
    <rect x="486" y="416" width="390" height="88" rx="12" fill="#f0ebfc" stroke="#baa9e2"/>
    <text x="506" y="446" font-size="19" font-weight="700" fill="#63439b">HoverPresenter shows the preview</text>
    <text x="506" y="474" font-size="16" fill="#263e50">Mouse: beside card. Touch: left, with backdrop.</text>

    <rect x="24" y="540" width="852" height="60" rx="12" fill="#ffffff" stroke="#d6dfe9"/>
    <text x="44" y="565" font-size="15" font-weight="700" fill="#263e50">Pointer claims and preview exclusivity are separate.</text>
    <text x="44" y="587" font-size="15" fill="#52647a">The arbiter handles touch ownership; the routing policy chooses which overlay may show.</text>
  </g>
</svg>
